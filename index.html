<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ESP32 Thermocouple Reader</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #101418;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #9da7b1;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* ================================================
           CONNECTION
        ================================================= */

        .connection-panel {

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;

            background: #1b2128;

            padding: 15px;

            border-radius: 12px;

            margin-bottom: 20px;
        }

        .status-area {

            display: flex;
            align-items: center;

            gap: 10px;
        }

        .status-dot {

            width: 14px;
            height: 14px;

            border-radius: 50%;

            background: #d9534f;
        }

        .status-dot.connected {

            background: #38c172;
        }

        button {

            border: none;

            border-radius: 8px;

            padding: 12px 20px;

            font-size: 16px;

            font-weight: bold;

            background: #2584ff;

            color: white;

            cursor: pointer;
        }

        button:disabled {

            opacity: 0.5;
        }

        /* ================================================
           CHANNEL GRID
        ================================================= */

        .temperature-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 20px;
        }

        .channel-card {

            background: #1b2128;

            border-radius: 12px;

            padding: 18px;

            text-align: center;
        }

        .channel-name {

            color: #9da7b1;

            font-size: 14px;

            letter-spacing: 1px;
        }

        .temperature {

            font-size: 30px;

            font-weight: bold;

            margin-top: 10px;

            color: #3ed67b;
        }

        .temperature.fault {

            color: #ff6b6b;
        }

        .temperature.wait {

            color: #9da7b1;
        }

        /* ================================================
           CARDS
        ================================================= */

        .card {

            background: #1b2128;

            border-radius: 12px;

            padding: 20px;

            margin-bottom: 15px;
        }

        .label {

            color: #9da7b1;

            font-size: 14px;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 10px;
        }

        .scan-value {

            font-size: 32px;

            font-weight: bold;

            color: #3aa0ff;
        }

        /* ================================================
           DEBUG
        ================================================= */

        #rawData {

            font-family: monospace;

            font-size: 14px;

            color: #d6dde5;

            margin-bottom: 15px;
        }

        #log {

            background: #13191f;

            border-radius: 8px;

            padding: 15px;

            min-height: 150px;

            max-height: 300px;

            overflow-y: auto;

            font-family: monospace;

            font-size: 12px;

            white-space: pre-wrap;
        }

        .error {

            color: #ff6b6b;

            margin-top: 15px;
        }

        /* ================================================
           MOBILE
        ================================================= */

        @media (max-width: 700px) {

            .temperature-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 450px) {

            body {
                padding: 12px;
            }

            .connection-panel {

                flex-direction: column;

                align-items: stretch;
            }

            .connection-panel button {

                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>ESP32 Thermocouple Reader</h1>


    <p class="subtitle">
        8-channel Bluetooth temperature telemetry
    </p>


    <!-- ================================================
         CONNECTION
    ================================================= -->

    <div class="connection-panel">


        <div class="status-area">


            <div
                id="statusDot"
                class="status-dot"
            ></div>


            <div>


                <strong id="statusText">
                    Disconnected
                </strong>


                <div
                    id="deviceName"
                    style="
                        color:#9da7b1;
                        font-size:13px;
                    "
                >
                    No device
                </div>


            </div>


        </div>


        <button id="connectButton">
            CONNECT TO ESP32
        </button>


    </div>


    <!-- ================================================
         TEMPERATURES
    ================================================= -->


    <div class="temperature-grid">


        <div class="channel-card">

            <div class="channel-name">
                TC0
            </div>

            <div
                id="temp0"
                class="temperature wait"
            >
                WAIT
            </div>

        </div>


        <div class="channel-card">

            <div class="channel-name">
                TC1
            </div>

            <div
                id="temp1"
                class="temperature wait"
            >
                WAIT
            </div>

        </div>


        <div class="channel-card">

            <div class="channel-name">
                TC2
            </div>

            <div
                id="temp2"
                class="temperature wait"
            >
                WAIT
            </div>

        </div>


        <div class="channel-card">

            <div class="channel-name">
                TC3
            </div>

            <div
                id="temp3"
                class="temperature wait"
            >
                WAIT
            </div>

        </div>


        <div class="channel-card">

            <div class="channel-name">
                TC4
            </div>

            <div
                id="temp4"
                class="temperature wait"
            >
                WAIT
            </div>

        </div>


        <div class="channel-card">

            <div class="channel-name">
                TC5
            </div>

            <div
                id="temp5"
                class="temperature wait"
            >
                WAIT
            </div>

        </div>


        <div class="channel-card">

            <div class="channel-name">
                TC6
            </div>

            <div
                id="temp6"
                class="temperature wait"
            >
                WAIT
            </div>

        </div>


        <div class="channel-card">

            <div class="channel-name">
                TC7
            </div>

            <div
                id="temp7"
                class="temperature wait"
            >
                WAIT
            </div>

        </div>


    </div>


    <!-- ================================================
         SCAN
    ================================================= -->

    <div class="card">


        <div class="label">
            Completed Scans
        </div>


        <div
            id="scanValue"
            class="scan-value"
        >
            0
        </div>


    </div>


    <!-- ================================================
         LAST PACKET
    ================================================= -->

    <div class="card">


        <div class="label">
            Last BLE Packet
        </div>


        <div id="rawData">
            Waiting for connection...
        </div>


    </div>


    <!-- ================================================
         DEBUG
    ================================================= -->

    <div class="card">


        <div class="label">
            BLE Diagnostic Log
        </div>


        <div id="log">
Waiting for connection...
        </div>


    </div>


    <div
        id="errorMessage"
        class="error"
    ></div>


</div>


<script>


    // ========================================================
    // BLE CONFIGURATION
    //
    // MATCHES FULL ESP32 THERMOCOUPLE FIRMWARE
    // ========================================================


    const DEVICE_NAME_PREFIX =
        "ESP32-Thermo8";


    const SERVICE_UUID =
        "91bad492-b950-4226-aa2b-4ede9fa42f61";


    const TEMP_UUID =
        "ca73b3ba-39f6-4ab3-91ae-186dc9577e11";


    const STATUS_UUID =
        "ca73b3ba-39f6-4ab3-91ae-186dc9577e12";


    // ========================================================
    // GLOBALS
    // ========================================================


    let bluetoothDevice =
        null;


    let gattServer =
        null;


    let tempCharacteristic =
        null;


    let statusCharacteristic =
        null;


    const decoder =
        new TextDecoder(
            "utf-8"
        );


    // ========================================================
    // ELEMENTS
    // ========================================================


    const connectButton =
        document.getElementById(
            "connectButton"
        );


    const statusDot =
        document.getElementById(
            "statusDot"
        );


    const statusText =
        document.getElementById(
            "statusText"
        );


    const deviceName =
        document.getElementById(
            "deviceName"
        );


    const rawData =
        document.getElementById(
            "rawData"
        );


    const scanValue =
        document.getElementById(
            "scanValue"
        );


    const log =
        document.getElementById(
            "log"
        );


    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    // ========================================================
    // LOG
    // ========================================================


    function addLog(message) {


        const time =
            new Date()
                .toLocaleTimeString();


        if (
            log.textContent.trim()
            ===
            "Waiting for connection..."
        ) {

            log.textContent =
                "";
        }


        log.textContent +=
            "[" +
            time +
            "] "
            +
            message
            +
            "\n";


        log.scrollTop =
            log.scrollHeight;
    }


    // ========================================================
    // BLE VALUE -> STRING
    // ========================================================


    function valueToString(value) {


        return decoder.decode(

            new Uint8Array(

                value.buffer,

                value.byteOffset,

                value.byteLength

            )

        );
    }


    // ========================================================
    // CONNECT BUTTON
    // ========================================================


    connectButton.addEventListener(

        "click",

        connectBluetooth

    );


    // ========================================================
    // CONNECT
    // ========================================================


    async function connectBluetooth() {


        errorMessage.textContent =
            "";


        try {


            if (!navigator.bluetooth) {


                throw new Error(

                    "Web Bluetooth unavailable. Use Chrome on Android."

                );
            }


            statusText.textContent =
                "Selecting device...";


            addLog(
                "Opening BLE device selector."
            );


            // ------------------------------------------------
            // IMPORTANT
            //
            // Use namePrefix rather than acceptAllDevices.
            //
            // This should now show ESP32-Thermo8 while
            // excluding unrelated nearby BLE devices.
            // ------------------------------------------------


            bluetoothDevice =

                await navigator.bluetooth.requestDevice({

                    filters: [

                        {
                            namePrefix:
                                DEVICE_NAME_PREFIX
                        }

                    ],

                    optionalServices: [

                        SERVICE_UUID

                    ]

                });


            const selectedName =

                bluetoothDevice.name

                ||

                "Unnamed device";


            deviceName.textContent =
                selectedName;


            addLog(

                "Selected: "
                +
                selectedName

            );


            bluetoothDevice.addEventListener(

                "gattserverdisconnected",

                handleDisconnect

            );


            statusText.textContent =
                "Connecting...";


            // ------------------------------------------------
            // GATT
            // ------------------------------------------------


            addLog(
                "Connecting to GATT server..."
            );


            gattServer =

                await bluetoothDevice
                    .gatt
                    .connect();


            addLog(
                "GATT connected."
            );


            // ------------------------------------------------
            // SERVICE
            // ------------------------------------------------


            addLog(
                "Finding thermocouple service..."
            );


            const service =

                await gattServer
                    .getPrimaryService(
                        SERVICE_UUID
                    );


            addLog(
                "Thermocouple service found."
            );


            // ------------------------------------------------
            // TEMPERATURE CHARACTERISTIC
            // ------------------------------------------------


            tempCharacteristic =

                await service
                    .getCharacteristic(
                        TEMP_UUID
                    );


            addLog(
                "Temperature characteristic found."
            );


            // ------------------------------------------------
            // STATUS CHARACTERISTIC
            // ------------------------------------------------


            statusCharacteristic =

                await service
                    .getCharacteristic(
                        STATUS_UUID
                    );


            addLog(
                "Status characteristic found."
            );


            // ------------------------------------------------
            // TEMPERATURE NOTIFICATIONS
            // ------------------------------------------------


            await tempCharacteristic
                .startNotifications();


            tempCharacteristic
                .addEventListener(

                    "characteristicvaluechanged",

                    handleTemperature

                );


            addLog(
                "Temperature notifications enabled."
            );


            // ------------------------------------------------
            // STATUS NOTIFICATIONS
            // ------------------------------------------------


            await statusCharacteristic
                .startNotifications();


            statusCharacteristic
                .addEventListener(

                    "characteristicvaluechanged",

                    handleStatus

                );


            addLog(
                "Status notifications enabled."
            );


            // ------------------------------------------------
            // INITIAL TEMPERATURE CHARACTERISTIC
            // ------------------------------------------------


            const initialTemp =

                await tempCharacteristic
                    .readValue();


            processTemperature(

                valueToString(
                    initialTemp
                )

            );


            // ------------------------------------------------
            // INITIAL STATUS
            // ------------------------------------------------


            const initialStatus =

                await statusCharacteristic
                    .readValue();


            processStatus(

                valueToString(
                    initialStatus
                )

            );


            // ------------------------------------------------
            // CONNECTED
            // ------------------------------------------------


            statusText.textContent =
                "Connected";


            statusDot.classList.add(
                "connected"
            );


            connectButton.textContent =
                "CONNECTED";


            connectButton.disabled =
                true;


            addLog(
                "BLE connection ready."
            );

        }


        catch (error) {


            console.error(
                error
            );


            statusText.textContent =
                "Disconnected";


            statusDot.classList.remove(
                "connected"
            );


            connectButton.disabled =
                false;


            errorMessage.textContent =
                error.message;


            addLog(

                "ERROR: "
                +
                error.message

            );

        }

    }


    // ========================================================
    // TEMPERATURE NOTIFICATION
    // ========================================================


    function handleTemperature(event) {


        const text =

            valueToString(
                event.target.value
            );


        processTemperature(
            text
        );
    }


    // ========================================================
    // PROCESS TEMPERATURE
    //
    // Expected:
    //
    // T0=21.50
    // T1=FAULT
    //
    // ========================================================


    function processTemperature(text) {


        rawData.textContent =
            text;


        addLog(
            "TEMP RX: " + text
        );


        const match =

            text.match(
                /^T([0-7])=(.+)$/
            );


        if (!match) {

            return;
        }


        const channel =
            parseInt(
                match[1]
            );


        const value =
            match[2];


        const element =

            document.getElementById(

                "temp"
                +
                channel

            );


        if (!element) {

            return;
        }


        element.classList.remove(

            "fault",
            "wait"

        );


        if (value === "FAULT") {


            element.textContent =
                "FAULT";


            element.classList.add(
                "fault"
            );

        }


        else if (value === "WAIT") {


            element.textContent =
                "WAIT";


            element.classList.add(
                "wait"
            );

        }


        else {


            const temperature =
                parseFloat(
                    value
                );


            if (
                !Number.isNaN(
                    temperature
                )
            ) {


                element.textContent =

                    temperature
                        .toFixed(2)

                    +
                    " °C";

            }

        }

    }


    // ========================================================
    // STATUS NOTIFICATION
    // ========================================================


    function handleStatus(event) {


        const text =

            valueToString(
                event.target.value
            );


        processStatus(
            text
        );

    }


    // ========================================================
    // PROCESS STATUS
    //
    // Expected:
    //
    // SCAN=123
    //
    // ========================================================


    function processStatus(text) {


        rawData.textContent =
            text;


        addLog(
            "STATUS RX: " + text
        );


        const match =

            text.match(
                /^SCAN=(\d+)$/
            );


        if (match) {


            scanValue.textContent =
                match[1];

        }

    }


    // ========================================================
    // DISCONNECT
    // ========================================================


    function handleDisconnect() {


        statusText.textContent =
            "Disconnected";


        statusDot.classList.remove(
            "connected"
        );


        connectButton.textContent =
            "CONNECT TO ESP32";


        connectButton.disabled =
            false;


        deviceName.textContent =
            "No device";


        addLog(
            "BLE disconnected."
        );

    }


</script>


</body>

</html>
