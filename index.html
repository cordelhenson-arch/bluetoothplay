```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ESP32 Thermocouple BLE Test</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #101418;
            color: white;
        }

        .container {

            max-width: 800px;
            margin: auto;
        }

        h1 {

            margin-bottom: 5px;
        }

        .subtitle {

            color: #9da7b1;

            margin-top: 0;
            margin-bottom: 25px;
        }


        /* =====================================================
           CONNECTION PANEL
        ===================================================== */

        .connection-panel {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 15px;

            background: #1b2128;

            border-radius: 12px;

            margin-bottom: 20px;
        }

        .status-area {

            display: flex;

            align-items: center;

            gap: 10px;
        }

        .status-dot {

            width: 14px;

            height: 14px;

            border-radius: 50%;

            background: #d9534f;
        }

        .status-dot.connected {

            background: #38c172;
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        button {

            border: none;

            border-radius: 8px;

            padding: 12px 20px;

            font-size: 16px;

            font-weight: bold;

            background: #2584ff;

            color: white;

            cursor: pointer;
        }

        button:disabled {

            opacity: 0.5;

            cursor: default;
        }


        /* =====================================================
           CARDS
        ===================================================== */

        .grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

            margin-bottom: 15px;
        }

        .card {

            background: #1b2128;

            border-radius: 12px;

            padding: 20px;

            margin-bottom: 15px;
        }

        .label {

            color: #9da7b1;

            font-size: 14px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        .big-value {

            font-size: 38px;

            font-weight: bold;

            margin-top: 8px;
        }

        #testValue {

            color: #3ed67b;
        }

        #packetCount {

            color: #3aa0ff;
        }


        /* =====================================================
           BLE DETAILS
        ===================================================== */

        .detail-row {

            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 10px 0;

            border-bottom:
                1px solid #303a44;
        }

        .detail-row:last-child {

            border-bottom: none;
        }

        .detail-name {

            color: #9da7b1;
        }

        .detail-value {

            text-align: right;

            font-family: monospace;

            word-break: break-all;
        }


        /* =====================================================
           LOG
        ===================================================== */

        #log {

            min-height: 180px;

            max-height: 350px;

            overflow-y: auto;

            padding: 15px;

            margin-top: 15px;

            background: #13191f;

            border-radius: 8px;

            font-family: monospace;

            font-size: 13px;

            white-space: pre-wrap;
        }

        .error {

            color: #ff6b6b;

            margin-top: 15px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {

                padding: 12px;
            }

            .connection-panel {

                flex-direction: column;

                align-items: stretch;
            }

            .connection-panel button {

                width: 100%;
            }

            .grid {

                grid-template-columns: 1fr;
            }

            .detail-row {

                flex-direction: column;

                gap: 5px;
            }

            .detail-value {

                text-align: left;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <h1>ESP32 Thermocouple Reader</h1>


    <p class="subtitle">
        Bluetooth LE diagnostic test
    </p>


    <!-- =====================================================
         CONNECTION
    ====================================================== -->

    <div class="connection-panel">


        <div class="status-area">


            <div
                id="statusDot"
                class="status-dot"
            ></div>


            <div>


                <strong id="statusText">
                    Disconnected
                </strong>


                <div
                    id="deviceName"
                    style="
                        color:#9da7b1;
                        font-size:13px;
                        margin-top:3px;
                    "
                >
                    No device
                </div>


            </div>


        </div>


        <button id="connectButton">
            CONNECT TO ESP32
        </button>


    </div>


    <!-- =====================================================
         LIVE VALUES
    ====================================================== -->

    <div class="grid">


        <div class="card">


            <div class="label">
                Latest BLE Value
            </div>


            <div
                id="testValue"
                class="big-value"
            >
                ----
            </div>


        </div>


        <div class="card">


            <div class="label">
                Packets Received
            </div>


            <div
                id="packetCount"
                class="big-value"
            >
                0
            </div>


        </div>


    </div>


    <!-- =====================================================
         BLE INFORMATION
    ====================================================== -->

    <div class="card">


        <div class="label">
            BLE Configuration
        </div>


        <div
            style="
                margin-top:15px;
            "
        >


            <div class="detail-row">


                <div class="detail-name">
                    Expected device
                </div>


                <div class="detail-value">
                    ESP32-Thermo8-Test
                </div>


            </div>


            <div class="detail-row">


                <div class="detail-name">
                    Service UUID
                </div>


                <div
                    id="serviceDisplay"
                    class="detail-value"
                ></div>


            </div>


            <div class="detail-row">


                <div class="detail-name">
                    Characteristic UUID
                </div>


                <div
                    id="characteristicDisplay"
                    class="detail-value"
                ></div>


            </div>


        </div>


    </div>


    <!-- =====================================================
         DEBUG LOG
    ====================================================== -->

    <div class="card">


        <div class="label">
            BLE Diagnostic Log
        </div>


        <div id="log">
Waiting for connection...
        </div>


    </div>


    <div
        id="errorMessage"
        class="error"
    ></div>


</div>


<script>


    // ========================================================
    // BLE SETTINGS
    //
    // THESE MUST MATCH THE ESP32-S3 FIRMWARE
    // ========================================================


    const DEVICE_NAME =
        "ESP32-Thermo8-Test";


    const SERVICE_UUID =
        "91bad492-b950-4226-aa2b-4ede9fa42f70";


    const TEST_CHARACTERISTIC_UUID =
        "ca73b3ba-39f6-4ab3-91ae-186dc9577f01";


    // ========================================================
    // BLUETOOTH GLOBALS
    // ========================================================


    let bluetoothDevice =
        null;


    let gattServer =
        null;


    let testCharacteristic =
        null;


    let receivedPackets =
        0;


    const decoder =
        new TextDecoder(
            "utf-8"
        );


    // ========================================================
    // HTML ELEMENTS
    // ========================================================


    const connectButton =
        document.getElementById(
            "connectButton"
        );


    const statusDot =
        document.getElementById(
            "statusDot"
        );


    const statusText =
        document.getElementById(
            "statusText"
        );


    const deviceName =
        document.getElementById(
            "deviceName"
        );


    const testValue =
        document.getElementById(
            "testValue"
        );


    const packetCount =
        document.getElementById(
            "packetCount"
        );


    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    const log =
        document.getElementById(
            "log"
        );


    // ========================================================
    // DISPLAY UUIDs
    // ========================================================


    document.getElementById(
        "serviceDisplay"
    ).textContent =
        SERVICE_UUID;


    document.getElementById(
        "characteristicDisplay"
    ).textContent =
        TEST_CHARACTERISTIC_UUID;


    // ========================================================
    // LOG FUNCTION
    // ========================================================


    function addLog(message) {


        const now =
            new Date();


        const time =
            now.toLocaleTimeString();


        if (
            log.textContent.trim()
            ===
            "Waiting for connection..."
        ) {

            log.textContent =
                "";
        }


        log.textContent +=
            "[" +
            time +
            "] " +
            message +
            "\n";


        log.scrollTop =
            log.scrollHeight;
    }


    // ========================================================
    // BLE VALUE -> STRING
    // ========================================================


    function valueToString(value) {


        return decoder.decode(

            new Uint8Array(

                value.buffer,

                value.byteOffset,

                value.byteLength

            )

        );
    }


    // ========================================================
    // CONNECT BUTTON
    // ========================================================


    connectButton.addEventListener(

        "click",

        connectBluetooth

    );


    // ========================================================
    // CONNECT BLUETOOTH
    // ========================================================


    async function connectBluetooth() {


        errorMessage.textContent =
            "";


        try {


            // ------------------------------------------------
            // CHECK WEB BLUETOOTH
            // ------------------------------------------------


            if (!navigator.bluetooth) {


                throw new Error(

                    "Web Bluetooth is not available in this browser."

                );
            }


            statusText.textContent =
                "Selecting device...";


            addLog(
                "Opening Bluetooth device selector."
            );


            // ------------------------------------------------
            // DEVICE SELECTION
            // ------------------------------------------------


            bluetoothDevice =

                await navigator.bluetooth.requestDevice({

                    filters: [

                        {
                            name:
                                DEVICE_NAME
                        }

                    ],

                    optionalServices: [

                        SERVICE_UUID

                    ]

                });


            addLog(

                "Selected device: "
                +
                bluetoothDevice.name

            );


            // ------------------------------------------------
            // DISCONNECT EVENT
            // ------------------------------------------------


            bluetoothDevice.addEventListener(

                "gattserverdisconnected",

                handleDisconnect

            );


            // ------------------------------------------------
            // CONNECT GATT
            // ------------------------------------------------


            statusText.textContent =
                "Connecting...";


            deviceName.textContent =
                bluetoothDevice.name;


            addLog(
                "Connecting to GATT server..."
            );


            gattServer =
                await bluetoothDevice.gatt.connect();


            addLog(
                "GATT connection established."
            );


            // ------------------------------------------------
            // GET SERVICE
            // ------------------------------------------------


            addLog(
                "Looking for thermocouple test service..."
            );


            const service =
                await gattServer.getPrimaryService(
                    SERVICE_UUID
                );


            addLog(
                "BLE service found."
            );


            // ------------------------------------------------
            // GET CHARACTERISTIC
            // ------------------------------------------------


            testCharacteristic =

                await service.getCharacteristic(

                    TEST_CHARACTERISTIC_UUID

                );


            addLog(
                "Test characteristic found."
            );


            // ------------------------------------------------
            // START NOTIFICATIONS
            // ------------------------------------------------


            await testCharacteristic
                .startNotifications();


            testCharacteristic
                .addEventListener(

                    "characteristicvaluechanged",

                    handleTestNotification

                );


            addLog(
                "Notifications enabled."
            );


            // ------------------------------------------------
            // READ INITIAL VALUE
            // ------------------------------------------------


            const initialValue =

                await testCharacteristic
                    .readValue();


            const initialText =
                valueToString(
                    initialValue
                );


            testValue.textContent =
                initialText;


            addLog(

                "Initial value: "
                +
                initialText

            );


            // ------------------------------------------------
            // CONNECTED
            // ------------------------------------------------


            statusText.textContent =
                "Connected";


            statusDot.classList.add(
                "connected"
            );


            connectButton.textContent =
                "CONNECTED";


            connectButton.disabled =
                true;


            addLog(
                "Bluetooth connection ready."
            );

        }


        catch (error) {


            console.error(
                error
            );


            statusText.textContent =
                "Disconnected";


            errorMessage.textContent =
                error.message;


            addLog(

                "ERROR: "
                +
                error.message

            );

        }

    }


    // ========================================================
    // TEST CHARACTERISTIC NOTIFICATION
    // ========================================================


    function handleTestNotification(event) {


        const text =
            valueToString(
                event.target.value
            );


        receivedPackets++;


        testValue.textContent =
            text;


        packetCount.textContent =
            receivedPackets;


        addLog(

            "RX: "
            +
            text

        );

    }


    // ========================================================
    // DISCONNECT
    // ========================================================


    function handleDisconnect() {


        statusText.textContent =
            "Disconnected";


        statusDot.classList.remove(
            "connected"
        );


        connectButton.textContent =
            "CONNECT TO ESP32";


        connectButton.disabled =
            false;


        deviceName.textContent =
            "No device";


        testCharacteristic =
            null;


        addLog(
            "Bluetooth disconnected."
        );

    }


</script>


</body>

</html>
